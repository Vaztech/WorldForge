; =============================================================================
; WorldForge Embark / Farming Seed + Crop Product Tags
; Append these to Config/DefaultGameplayTags.ini under [/Script/GameplayTags.GameplayTagsSettings]
;
; Current FarmingSubsystem seed gate uses category seed tags such as:
;   WorldForge.Item.Seed.Grain
;
; Future crop-specific embark/UI can use:
;   WorldForge.Item.Seed.Potato  -> seed item
;   WorldForge.Item.Crop.Potato  -> harvested food/product
; =============================================================================

